apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-controller
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: apps-local
  source:
    path: sample-loki-api/k8s
    repoURL: https://github.com/labcabrera/sample-spring-boot-loki-integration/
    targetRevision: HEAD
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
