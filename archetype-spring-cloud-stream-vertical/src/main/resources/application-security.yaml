spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IAM_JWK_URI:http://localhost:8090/realms/sample/protocol/openid-connect/certs}
          issuer-uri: ${IAM_ISSUER_URI:http://localhost:8090/auth/realms/sample}

# Disable creation of JSESSIONID servlet cookie (best-effort; also enforce stateless sessions in SecurityConfiguration)
server:
  servlet:
    session:
      cookie:
        enabled: false

# Example: allow unauthenticated access to actuator/health and swagger UI
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
