spring:
  application:
    name: loki-integration
  webflux:
    # WebFlux specific configurations
    base-path: /
    static-path-pattern: /**

logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss}","level":"%p","thread":"%t","logger":"%c","message":"%m"}'
  level:
    root: ${LOG_LEVEL:INFO}

server:
  port: 8081
  
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always