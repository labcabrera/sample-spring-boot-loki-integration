spring:
  application:
    name: loki-integration
  main:
    banner-mode: off
  webflux:
    # WebFlux specific configurations
    base-path: /
    static-path-pattern: /**

# Axon Framework Configuration
axon:
  axonserver:
    enabled: false
  serializer:
    events: jackson
    messages: jackson

logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss}","level":"%p","thread":"%t","logger":"%c","message":"%m"}\n'
  level:
    org.labcabrera: ${LOG_LEVEL:DEBUG} 
    org.axonframework: ${AXON_LOG_LEVEL:INFO}
    root: INFO

server:
  port: 8081
  
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,axon
  endpoint:
    health:
      show-details: always